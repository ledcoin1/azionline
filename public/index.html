<!DOCTYPE html>
<html>
<body>

<h2>Telegram Mini App Онлайн Ойын</h2>
<button id="joinBtn">Ойынға қосыл</button>

<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script>
const socket = io("http://localhost:3000");

const joinBtn = document.getElementById("joinBtn");

// Telegram Mini App ойыншысы
let telegramUser = {
    id: 123456,
    username: "Ayan"
};

joinBtn.addEventListener("click", () => {
    socket.emit("playerJoined", telegramUser);
    alert("Серверге хабар жіберілді! Консольді тексеріңіз.");
});
</script>
</body>
</html>
