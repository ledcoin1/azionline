<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Telegram WebApp Тест</title>
</head>
<body>
<h1>Telegram Mini App тесті</h1>
<p id="info">Жүктелуде...</p>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const info = document.getElementById("info");
  if(window.Telegram?.WebApp){
    const user = window.Telegram.WebApp.initDataUnsafe.user;
    info.textContent = user 
      ? `Сәлем, ${user.first_name} (ID: ${user.id})` 
      : "WebApp ашылды, бірақ пайдаланушы жоқ";
  } else {
    info.textContent = "Telegram WebApp анықталмады. И frame дұрыс ашылған жоқ.";
  }
});
</script>
</body>
</html>
