<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Card Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#111;
  color:white;
  text-align:center;
}

.top{
  padding:15px;
  background:#1c1c1c;
}

.playBtn{
  background:chartreuse;
  border:none;
  padding:12px 25px;
  font-size:18px;
  border-radius:8px;
  cursor:pointer;
  margin-top:15px;
}

.hidden{
  display:none;
}

.table{
  margin-top:40px;
  min-height:120px;
}

.cards{
  margin-top:40px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.card{
  background:white;
  color:black;
  padding:12px 18px;
  border-radius:10px;
  font-size:20px;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.1);
}

.turn{
  color:chartreuse;
  margin-top:10px;
  font-weight:bold;
}

.players{
  margin-top:20px;
  font-size:14px;
  opacity:0.8;
}
</style>
</head>
<body>

<div class="top">
  <div>ID: <span id="tgId">...</span></div>
  <div>Balance: <span id="balance">...</span></div>
  <button id="play" class="playBtn">PLAY</button>
  <div id="turnInfo" class="turn"></div>
</div>

<div id="gameArea" class="hidden">

  <div class="table">
    <h3>Үстел</h3>
    <div id="tableCards" class="cards"></div>
  </div>

  <div>
    <h3>Сенің карталарың</h3>
    <div id="myCards" class="cards"></div>
  </div>

  <div class="players" id="playersInfo"></div>

</div>

<div id="winner"></div>

<script>
const socket = io();
const tg = window.Telegram.WebApp;
tg.expand();

let telegramId = null;

/* ========= TELEGRAM LOGIN ========= */
const user = tg.initDataUnsafe?.user;

if(user){
  telegramId = user.id;
  document.getElementById("tgId").innerText = telegramId;

  fetch("/api/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ telegramId })
  })
  .then(res=>res.json())
  .then(data=>{
    document.getElementById("balance").innerText = data.balance;
  });
}else{
  document.getElementById("tgId").innerText = "Not Telegram";
}

/* ========= PLAY ========= */
document.getElementById("play").onclick = ()=>{
  socket.emit("play",{ telegramId });
};

/* ========= PLAYERS ========= */
socket.on("players",(players)=>{
  const me = players.find(p=>p.telegram == telegramId);

  if(players.length === 2){
    document.getElementById("gameArea").classList.remove("hidden");
    document.getElementById("play").style.display="none";
  }

  if(me){
    if(me.turn){
      document.getElementById("turnInfo").innerText = "🔥 Сенің кезегің!";
    }else{
      document.getElementById("turnInfo").innerText = "⏳ Қарсылас жүріп жатыр";
    }
  }

  document.getElementById("playersInfo").innerText =
    players.map(p=>`ID:${p.telegram} | Раунд:${p.raund}`).join(" | ");
});

/* ========= CARDS ========= */
socket.on("cards",(cards)=>{
  const box = document.getElementById("myCards");
  box.innerHTML="";

  cards.forEach(card=>{
    const div = document.createElement("div");
    div.className="card";
    div.innerText=card;

    div.onclick=()=>{
      socket.emit("attack",card);
    };

    box.appendChild(div);
  });
});

/* ========= TABLE ========= */
socket.on("table",(cards)=>{
  const box = document.getElementById("tableCards");
  box.innerHTML="";

  cards.forEach(card=>{
    const div = document.createElement("div");
    div.className="card";
    div.innerText=card;
    box.appendChild(div);
  });
});

/* ========= WINNER ========= */
socket.on("gameWinner",(data)=>{
  document.getElementById("winner").innerHTML =
    `<h2>🏆 Жеңімпаз: ${data.telegram}</h2>
     <h3>Баланс: ${data.balans}</h3>`;
});

/* ========= ERRORS ========= */
socket.on("error",(msg)=>{
  alert(msg);
});

socket.on("balanceError",(msg)=>{
  alert(msg);
});
</script>

</body>
</html>
