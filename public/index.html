<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Сервер қосылғандар</title>
</head>
<body>
<h1>Жаңа ойыншылар</h1>
<ul id="players"></ul>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const playersList = document.getElementById("players");

  socket.on("connect", () => {
    const li = document.createElement("li");
    li.textContent = `Сіз қосылдыңыз: ${socket.id}`;
    playersList.appendChild(li);
  });

  // Серверге жаңа ойыншы қосылғанда консольға шығару
  // Сенің кодта хабарлама тек console.log
</script>
</body>
</html>
