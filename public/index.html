<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Telegram Mini App Тест</title>
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#1e1e2f; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; }
  h1 { text-align:center; }
</style>
</head>
<body>

<h1>Telegram Mini App ашылды! 🎉</h1>
<p id="userInfo"></p>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const tg = window.Telegram?.WebApp;

  if(tg){
    tg.expand();
    const user = tg.initDataUnsafe.user;
    document.getElementById("userInfo").textContent = user 
      ? `Сәлем, ${user.first_name} (ID: ${user.id})` 
      : "Пайдаланушы деректері алынбады";
  } else {
    document.getElementById("userInfo").textContent = "Telegram WebApp анықталмады";
  }
});
</script>

</body>
</html>
