<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Ойын Лобби</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #1c92d2, #f2fcfe);
    color: #333;
    text-align: center;
    margin: 0;
    padding: 0;
  }
  h1 {
    margin-top: 50px;
    font-size: 3em;
  }
  #info {
    margin-top: 20px;
    padding: 20px;
    background: rgba(255,255,255,0.8);
    border-radius: 15px;
    display: inline-block;
  }
      

            

  .button-container {        
  display: flex;             /* flexbox қолданамыз */
  justify-content: center;   /* көлденең орталыққа шығару */
  align-items: center;       /* тік орталыққа шығару */
  height: 300px;             /* батырма орналасатын блок биіктігі */
}

button {
  padding: 15px 40px;           /* батырманың өлшемі */
  font-size: 1.2em;             /* мәтін көлемі */
  font-weight: bold;
  border-radius: 12px;          /* бұрышты сәл дөңгелету */
  border: none;                 /* шет сызықсыз */
  background: linear-gradient(to right, #ff7e5f, #feb47b); /* градиент фоны */
  color: #fff;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s; /* анимация */
}

button:hover {
  transform: scale(1.05);       /* hover кезінде сәл үлкейту */
  box-shadow: 0 8px 15px rgba(0,0,0,0.2); /* көлеңке қосу */
}


</style>
</head>
<body>

<h1>Карта</h1>

<div class="button-container">
  <button id="myButton">Играть</button>    

  <div id="roomScreen" style="display:none;">
  <h2>🎮 Комната</h2>
  <p>Қатысушылар:</p>
  <ul id="playersList"></ul>
</div>

<div id="betScreen" style="display:none; 
    position: fixed; top:50%; left:50%; transform: translate(-50%, -50%);
    background: white; padding: 30px; border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3); text-align: center; z-index:100;">
  <h2>🎲 Ставка</h2>
  <p id="betQuestion">Ставка 500</p>
  <div style="margin-top: 20px;">
    <button id="acceptBet" style="margin-right:15px; padding:10px 25px; font-weight:bold; border-radius:8px; background: #4CAF50; color:white; border:none; cursor:pointer;">Қабылдаймын</button>
    <button id="declineBet" style="padding:10px 25px; font-weight:bold; border-radius:8px; background: #f44336; color:white; border:none; cursor:pointer;">Бас тартамын</button>
  </div>
</div>


 <script src="/socket.io/socket.io.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const socket = io();
const myButton = document.getElementById("myButton");
const roomScreen = document.getElementById("roomScreen");
const playersList = document.getElementById("playersList");

const betScreen = document.getElementById("betScreen");
const betQuestion = document.getElementById("betQuestion");
const acceptBet = document.getElementById("acceptBet");
const declineBet = document.getElementById("declineBet");

  
  
const tgUser = window.Telegram.WebApp.initDataUnsafe?.user || {};
let players = [];

// Батырма басылғанда серверге хабар жіберу
myButton.addEventListener("click", () => {
    const playerName = tgUser.first_name || "Ойыншы";
    const telegramId = tgUser.id || null;

    socket.emit("playerJoined", { name: playerName, telegramId });

    // Батырманы жасыру (міндетті емес)
    myButton.style.display = "none";

    // Комната экранын көрсету
    roomScreen.style.display = "block";
});

// Серверден кім кімге қосылды хабар келгенде
socket.on("roomData", data => {
  players = data; // енді әр ойыншы объект болады {name, telegramId, status}
  renderPlayers();
});

socket.on("playerJoinedRoom", data => {
  players.push(data);
  renderPlayers();
});

// Серверден сұрақ келгенде
socket.on("askBet", data => {
  betQuestion.textContent = data.question + " (" + data.amount + ")";
  betScreen.style.display = "block"; // блокты көрсету
});

// Қабылдау батырмасы
acceptBet.addEventListener("click", () => {
  socket.emit("betResponse", { accepted: true, amount: 500 });
  betScreen.style.display = "none"; // блокты жасыру
});

// Бас тарту батырмасы
declineBet.addEventListener("click", () => {
  socket.emit("betResponse", { accepted: false, amount: 500 });
  betScreen.style.display = "none"; // блокты жасыру
});

function renderPlayers() {
  playersList.innerHTML = "";
  players.forEach(p => {
    const li = document.createElement("li");
    li.textContent = `👤 ${p.name} [${p.status}]`; // статус көрсетіледі
    playersList.appendChild(li);
  });
}

</script>

</body>
</html>
