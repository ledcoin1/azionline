<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Mini App Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    #lobby, #room {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 500px;
      margin: 20px 0;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      background: white;
    }
    .player {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #4a90e2;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    #joinBtn {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      background: #27ae60;
      color: white;
      cursor: pointer;
    }
    #joinBtn:hover {
      background: #2ecc71;
    }
  </style>
</head>
<body>

  <h1>Лобби</h1>
  <div id="lobby"></div>

  <button id="joinBtn">Ойынға қосыл</button>

  <h1>Бөлме (Комта)</h1>
  <div id="room"></div>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
