<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Card Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .play{
      background-color: chartreuse;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>🃏 Card Game</h2>

  <div class="box">
    <p><b>Your Telegram ID:</b></p>
    <p id="tgId">Loading...</p>
  </div>

  <div class="box">
    <p><b>Your Balance:</b></p>
    <p id="balance">Loading...</p>
  </div>



  <button id="play">play</button>

  <div id="gameArea" style="display:none;" class="box">
  <h3>🎮 Ойын басталды!</h3>
  <p id="players"></p>
</div>



<script src="/socket.io/socket.io.js"></script>

<script>

  let telegramId;
  const tg = window.Telegram.WebApp;
  tg.expand();

  const user = tg.initDataUnsafe?.user;

  if (!user) {
    document.getElementById("tgId").innerText = "Not opened in Telegram";
  } else {

       telegramId = user.id;

    telegramId = user.id;
    document.getElementById("tgId").innerText = telegramId;

    // LOGIN API-ға сұрау
    fetch("/api/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ telegramId })
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById("balance").innerText = data.balance;
    })
    .catch(err => {
      document.getElementById("balance").innerText = "Error";
    });

  }


  


  const socket = io();

  document.getElementById("play").addEventListener("click",()=>{
    socket.emit("play",{telegramId});
  });



  socket.on("bastaldy", (komta) => {

  // Егер мен осы ойында болсам ғана көрсетеміз
  if (komta.player1 === telegramId || komta.player2 === telegramId) {

    // Play кнопкасын жасырамыз
    document.getElementById("play").style.display = "none";

    // Ойын алаңын көрсетеміз
    document.getElementById("gameArea").style.display = "block";

    // Қарсыласты шығару
    document.getElementById("players").innerText =
      "Ойыншылар: " + komta.player1 + " vs " + komta.player2;
  }

});


  socket.on("cards", (cards) => {
  console.log("Менің карталарым:", cards);
});




</script>

</body>
</html>
