<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <title>Лобби & Бөлме</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
    h2 { margin-top: 20px; }
    #lobby, #room { background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    .player { margin: 5px 0; }
    button { padding: 5px 10px; font-size: 14px; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Онлайн ойын лобби</h1>

  <div>
    <input type="text" id="playerName" placeholder="Аты-жөніңіз">
    <button id="joinBtn">Лоббиге қосылу</button>
  </div>

  <h2>Лоббидағы ойыншылар:</h2>
  <div id="lobby"></div>

  <h2>Сіздің бөлмеңіз:</h2>
  <div id="room"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const lobbyDiv = document.getElementById("lobby");
    const roomDiv = document.getElementById("room");
    const joinBtn = document.getElementById("joinBtn");
    const playerNameInput = document.getElementById("playerName");

    let myRoomId = null;

    // Лоббиге қосылу
    joinBtn.addEventListener("click", () => {
      const name = playerNameInput.value.trim();
      if(!name) return alert("Атыңызды енгізіңіз");

      socket.emit("playerJoined", { name });
      joinBtn.disabled = true;
      playerNameInput.disabled = true;
    });

    // Лобби жаңарту
    socket.on("lobbyUpdate", (lobby) => {
      lobbyDiv.innerHTML = "";
      if(lobby.length === 0) {
        lobbyDiv.innerHTML = "<i>Лобби бос</i>";
        return;
      }
      lobby.forEach(p => {
        const div = document.createElement("div");
        div.className = "player";
        div.textContent = p.player.name;
        lobbyDiv.appendChild(div);
      });
    });

    // Бөлме жасалды
    socket.on("roomCreated", (data) => {
      myRoomId = data.roomId;
      roomDiv.innerHTML = "";
      const title = document.createElement("div");
      title.textContent = `Бөлме ID: ${data.roomId}`;
      roomDiv.appendChild(title);

      data.players.forEach(p => {
        const div = document.createElement("div");
        div.className = "player";
        div.textContent = p.player.name + (p.player.name === playerNameInput.value ? " (Сіз)" : "");
        roomDiv.appendChild(div);
      });
    });
  </script>
</body>
</html>
