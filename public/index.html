<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Telegram Mini App</title>
<style>
body { margin:0; font-family:Arial,sans-serif; background:#1e1e2f; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; }
#room { width:400px; height:300px; background:#2c2c3c; border-radius:20px; display:flex; flex-direction:column; justify-content:space-between; align-items:center; padding:20px; position:relative; }
.player { width:150px; height:80px; background:#4e9af1; border-radius:15px; display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:18px; }
.topPlayer { transform:rotate(180deg); margin-bottom:auto; }
.bottomPlayer { margin-top:auto; }
#roomTitle { position:absolute; top:10px; left:50%; transform:translateX(-50%); font-weight:bold; font-size:20px; }
</style>
</head>
<body>

<div id="room" style="display:none;">
  <div id="roomTitle"></div>
  <div class="player topPlayer" id="player1">Қарсылас</div>
  <div class="player bottomPlayer" id="player2">Сіз</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const tg = window.Telegram?.WebApp;

  if(!tg){
    alert("Бұл тек Telegram ішінде жұмыс істейді!");
    return;
  }

  tg.expand();

  const user = tg.initDataUnsafe.user;
  const myId = user?.id;
  const myName = user?.first_name || "Сіз";

  const socket = io();

  // Серверге қосылу
  socket.emit("playerJoined", { name: myName, telegramId: myId });

  const roomDiv = document.getElementById("room");
  const roomTitle = document.getElementById("roomTitle");
  const player1Div = document.getElementById("player1");
  const player2Div = document.getElementById("player2");

  socket.on("roomCreated", (data) => {
    roomDiv.style.display = "flex";
    roomTitle.textContent = `Бөлме ID: ${data.roomId}`;

    let mePlayer, otherPlayer;

    if(data.players[0].player.telegramId === myId){
      mePlayer = data.players[0].player.name;
      otherPlayer = data.players[1].player.name;
    } else {
      mePlayer = data.players[1].player.name;
      otherPlayer = data.players[0].player.name;
    }

    player1Div.textContent = otherPlayer || "Қарсылас";
    player2Div.textContent = mePlayer || "Сіз";
  });
});
</script>

</body>
</html>
