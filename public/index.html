<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Durak Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle at center,#1b5e20,#0d1b0d);
  color:white;
  text-align:center;
  overflow-x:hidden;
}

.top{
  background:#111;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.playBtn{
  background:linear-gradient(45deg,chartreuse,lime);
  border:none;
  padding:10px 25px;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.bank{
  font-weight:bold;
  color:gold;
}

.hidden{ display:none; }

.game{
  position:relative;
  height:85vh;
}

/* Үстел */
.table{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:15px;
}

/* Карта */
.card{
  width:70px;
  height:100px;
  background:white;
  color:black;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 5px 10px rgba(0,0,0,0.5);
  animation:deal 0.4s ease;
}

.card:hover{
  transform:translateY(-10px) scale(1.1);
}

@keyframes deal{
  from{ transform:translateY(-40px); opacity:0; }
  to{ transform:translateY(0); opacity:1; }
}

/* Қарсылас */
.opponent{
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
}

/* Жабық карта */
.back{
  width:70px;
  height:100px;
  background:linear-gradient(45deg,#333,#555);
  border-radius:10px;
  box-shadow:0 5px 10px rgba(0,0,0,0.5);
}

/* Менің карталарым */
.myCards{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
}

.turn{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  color:chartreuse;
  font-weight:bold;
}
.winner{
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:28px;
  color:gold;
}
</style>
</head>
<body>

<div class="top">
  <div>ID: <span id="tgId"></span></div>
  <div>Balance: <span id="balance"></span></div>
  <div class="bank">💰 Банк: <span id="bank">0</span></div>
  <button id="play" class="playBtn">PLAY</button>
</div>

<div id="game" class="game hidden">

  <div id="turnInfo" class="turn"></div>

  <div class="opponent" id="opponentCards"></div>

  <div class="table" id="table"></div>

  <div class="myCards" id="myCards"></div>

  <div id="winner" class="winner"></div>

</div>

<script>
const socket = io();
const tg = window.Telegram.WebApp;
tg.expand();

let telegramId=null;

const user=tg.initDataUnsafe?.user;
if(user){
  telegramId=user.id;
  tgId.innerText=telegramId;

  fetch("/api/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ telegramId })
  })
  .then(res=>res.json())
  .then(data=>{
    balance.innerText=data.balance;
  });
}

play.onclick=()=>{
  socket.emit("play",{ telegramId });
};

/* PLAYERS */
socket.on("players",(players)=>{
  const me=players.find(p=>p.telegram==telegramId);
  if(players.length===2){
    game.classList.remove("hidden");
    play.style.display="none";
  }

  if(me){
    turnInfo.innerText=me.turn?"🔥 Сенің кезегің":"⏳ Қарсылас жүріп жатыр";
  }

  /* қарсылас жабық 3 карта */
  const opponent=players.find(p=>p.telegram!=telegramId);
  opponentCards.innerHTML="";
  if(opponent){
    for(let i=0;i<opponent.cards.length;i++){
      const div=document.createElement("div");
      div.className="back";
      opponentCards.appendChild(div);
    }
  }
});

/* МЕНІҢ КАРТАЛАР */
socket.on("cards",(cards)=>{
  myCards.innerHTML="";
  cards.forEach(card=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerText=card;
    div.onclick=()=>socket.emit("attack",card);
    myCards.appendChild(div);
  });
});

/* ҮСТЕЛ */
socket.on("table",(cards)=>{
  table.innerHTML="";
  cards.forEach(card=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerText=card;
    table.appendChild(div);
  });
});

/* ЖЕҢІМПАЗ */
socket.on("gameWinner",(data)=>{
  winner.innerText="🏆 "+data.telegram+" жеңді!";
});

/* БАНК */
socket.on("players",(players)=>{
  let bank=players.length*500;
  document.getElementById("bank").innerText=bank;
});

/* ҚАТЕ */
socket.on("error",(msg)=>alert(msg));
socket.on("balanceError",(msg)=>alert(msg));
</script>

</body>
</html>
