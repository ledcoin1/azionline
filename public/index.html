
<!DOCTYPE html>
<html>
<body>

<h2>Telegram Mini App Онлайн Ойын</h2>
<button id="joinBtn">Ойынға қосыл</button>

<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script>
const socket = io();
const joinBtn = document.getElementById("joinBtn");

// Telegram Mini App нақты қолданушы деректері
joinBtn.addEventListener("click", () => {
    const telegramUser = window.Telegram.WebApp.initDataUnsafe.user;
    
    socket.emit("playerJoine", telegramUser);
    alert(`Серверге ${telegramUser.first_name} хабар жіберілді! Консольді тексеріңіз.`);
});
</script>

<!-- Telegram WebApp SDK автоматты қосылады, бірақ кейде botfather параметрлері арқылы керек -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

</body>
</html>
